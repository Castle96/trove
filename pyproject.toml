[project]
name = "trove"
version = "0.4.0"
description = "Unified homelab control plane: PKI & certificate lifecycle, Docker monitoring, inventory, vulnerability scanning, agent swarm, voice pipeline, and API gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trove contributors" }]
keywords = [
    "pki",
    "certificate-management",
    "x509",
    "homelab",
    "docker",
    "monitoring",
    "api-gateway",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "aiosqlite>=0.22.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "asyncssh>=2.24.0",
    "asyncpg>=0.31.0",  # PostgreSQL driver (used when DOCKWATCH_DATABASE_URL uses +asyncpg)
    "docker[ssh]>=7.2.0",
    "psutil>=7.2.2",
    "slowapi>=0.1.10",
    "prometheus-client>=0.26.0",  # /api/metrics export
    "faster-whisper>=1.2.1",
    "piper-tts>=1.8.0",
]

[project.scripts]
jarvis-worker = "app.dockwatch.services.voice_worker:main"

[project.optional-dependencies]
voice-mic = [
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.16.8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: tests that exercise a live component (Docker, psutil, DB)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
